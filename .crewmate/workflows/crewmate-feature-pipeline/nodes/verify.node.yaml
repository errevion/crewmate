id: verify
instructions: >
  Perform rigorous verification of the implementation against reconciled
  contracts.

  Run the test suite (e.g. npm test or npm run test:src) and verify all unit,
  integration, and regression tests pass without errors.

  Scan for architectural boundary violations and dead code.
inputs:
  - diff
  - contract_refs
subagent:
  role: verifier
  agent: verifier
  scope: read-only
guardrails:
  pre:
    - type: hard
      run: crewmate scan arch
  post:
    - type: hard
      run: npm test
    - type: hard
      run: crewmate scan dead-code
    - type: hard
      run: crewmate scan arch
on_fail: route(execute)
on_fail_max_retries: 2
escalate_after_max_retries: human
