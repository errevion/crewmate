changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
      - github-actions

  categories:
    - title: "Breaking Changes"
      labels:
        - breaking

    - title: "Features"
      labels:
        - feature
        - enhancement

    - title: "Bug Fixes"
      labels:
        - bug
        - fix

    - title: "Performance"
      labels:
        - performance

    - title: "Documentation"
      labels:
        - documentation
        - docs

    - title: "Dependencies"
      labels:
        - dependencies

    - title: "Internal"
      labels:
        - chore
        - refactor
        - ci
        - test

    - title: "Other Changes"
      labels:
        - "*"
