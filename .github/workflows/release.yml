name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: crewmate-watch
            use_cross: false
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: crewmate-watch
            use_cross: true
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: crewmate-watch
            use_cross: false
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: crewmate-watch
            use_cross: false
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: crewmate-watch.exe
            use_cross: false
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/crewmate-watch
          key: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build Rust binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --manifest-path crates/crewmate-watch/Cargo.toml
          else
            cargo build --release --target ${{ matrix.target }} --manifest-path crates/crewmate-watch/Cargo.toml
          fi
        shell: bash

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.binary_name }}
        run: |
          ARCHIVE_NAME="crewmate-watch-${RELEASE_TAG}-${TARGET}"
          STAGING="staging/${ARCHIVE_NAME}"

          mkdir -p "${STAGING}"
          mkdir -p dist-assets

          if [ -f "crates/crewmate-watch/target/${TARGET}/release/${BIN_NAME}" ]; then
            BIN_PATH="crates/crewmate-watch/target/${TARGET}/release/${BIN_NAME}"
          elif [ -f "target/${TARGET}/release/${BIN_NAME}" ]; then
            BIN_PATH="target/${TARGET}/release/${BIN_NAME}"
          else
            echo "Error: Binary ${BIN_NAME} not found for target ${TARGET}"
            exit 1
          fi

          cp "${BIN_PATH}" "${STAGING}/"
          chmod +x "${STAGING}/${BIN_NAME}"
          [ -f README.md ] && cp README.md "${STAGING}/"
          [ -f LICENSE ] && cp LICENSE "${STAGING}/"

          tar -czf "dist-assets/${ARCHIVE_NAME}.tar.gz" -C staging "${ARCHIVE_NAME}"

          cd dist-assets
          if command -v sha256sum &> /dev/null; then
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi
        shell: bash

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.binary_name }}
        run: |
          $ArchiveName = "crewmate-watch-$env:RELEASE_TAG-$env:TARGET"
          $Staging = "staging/$ArchiveName"

          New-Item -ItemType Directory -Force -Path $Staging | Out-Null
          New-Item -ItemType Directory -Force -Path "dist-assets" | Out-Null

          $BinPath = ""
          if (Test-Path "crates/crewmate-watch/target/$env:TARGET/release/$env:BIN_NAME") {
              $BinPath = "crates/crewmate-watch/target/$env:TARGET/release/$env:BIN_NAME"
          } elseif (Test-Path "target/$env:TARGET/release/$env:BIN_NAME") {
              $BinPath = "target/$env:TARGET/release/$env:BIN_NAME"
          } else {
              Write-Error "Error: Binary $env:BIN_NAME not found for target $env:TARGET"
              exit 1
          }

          Copy-Item $BinPath -Destination "$Staging/"
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination "$Staging/" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "$Staging/" }

          Compress-Archive -Path $Staging -DestinationPath "dist-assets/$ArchiveName.zip" -Force

          Set-Location dist-assets
          $Hash = (Get-FileHash -Algorithm SHA256 "$ArchiveName.zip").Hash.ToLower()
          "$Hash  $ArchiveName.zip" | Out-File -Encoding ascii "$ArchiveName.zip.sha256"
        shell: pwsh

      - name: Upload binary asset
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all binary assets
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz *.zip > checksums.sha256
          echo "Generated combined checksums.sha256:"
          cat checksums.sha256
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.tag || github.ref_name }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
          body: |
            ## Installation
            ```sh
            npm install -g crew-mate
            ```
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    name: Publish to npm
    needs: [build-binaries, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify package
        run: npm pack --dry-run

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_AUTH_TOKEN }}
