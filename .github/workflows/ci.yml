name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Needed for checking changed files

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Check for Rust changes
        id: rust-changes
        uses: tj-actions/changed-files@v42
        with:
          files: |
            crates/**
            .github/workflows/ci.yml

      - name: Setup Rust
        if: steps.rust-changes.outputs.any_changed == 'true' || github.event_name == 'push'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        if: steps.rust-changes.outputs.any_changed == 'true' || github.event_name == 'push'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/crewmate-watch

      - name: Format Check (Rust)
        if: steps.rust-changes.outputs.any_changed == 'true' || github.event_name == 'push'
        run: cargo fmt --manifest-path crates/crewmate-watch/Cargo.toml -- --check

      - name: Clippy (Rust)
        if: steps.rust-changes.outputs.any_changed == 'true' || github.event_name == 'push'
        run: cargo clippy --manifest-path crates/crewmate-watch/Cargo.toml -- -D warnings

      - name: Test (Rust)
        if: steps.rust-changes.outputs.any_changed == 'true' || github.event_name == 'push'
        run: cargo test --manifest-path crates/crewmate-watch/Cargo.toml

      - name: Build Rust Binary (Release)
        if: steps.rust-changes.outputs.any_changed == 'true' || github.event_name == 'push'
        run: npm run build:watch

      - name: Build TypeScript
        run: npm run build

      - name: Test (Node.js)
        run: npm test
